[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 50
fail_on_revert = false

[fmt]
line_length = 120

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
